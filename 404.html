    <div class="header-meta">

<script>
document.getElementById('theme-toggle').addEventListener('click',function(){
  var h=document.documentElement;
  if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.removeItem('theme');}
  else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}
});
</script>
</body>
